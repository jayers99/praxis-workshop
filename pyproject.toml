[project]
name = "praxis-workshop"
version = "0.1.0"
description = "Symlink-based workshop system for managing work items through stages"
authors = [{ name = "jayers99" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1,<0.16",
    "rich>=13.9.4",
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
]

[project.scripts]
steward = "steward.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-bdd>=8.1.0",
    "ruff>=0.8.4",
    "mypy>=1.14.1",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
